spring.datasource.url=${CARRITO_DB_URL:jdbc:postgresql://localhost:5432/carrito_ev3}
spring.datasource.username=${CARRITO_DB_USER:ev3}
spring.datasource.password=${CARRITO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${LOCAL_JWT_JWK_SET_URI:}
