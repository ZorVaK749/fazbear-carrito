# Laboratorio AWS: H2 persistente en archivo sobre EBS por defecto (PostgreSQL opcional vía CARRITO_DB_URL)
server.port=${SERVER_PORT:8083}
carrito.catalogo-url=${PRODUCTOS_URL:}
spring.datasource.url=${CARRITO_DB_URL:jdbc:h2:file:/var/lib/fazbear/carrito/carritodb;AUTO_SERVER=FALSE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${CARRITO_DB_USER:sa}
spring.datasource.password=${CARRITO_DB_PASSWORD:}
spring.datasource.driver-class-name=${CARRITO_DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${CARRITO_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${CARRITO_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.h2.console.enabled=false
ev3.kafka.enabled=${EV3_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/ee0d2c5b-e60b-4c57-9b30-8a38a520c430/v2.0
spring.security.oauth2.resourceserver.jwt.client-id=304fa289-2b72-447b-9c48-f00998f7c22f
spring.security.oauth2.resourceserver.jwt.tenant-id=ee0d2c5b-e60b-4c57-9b30-8a38a520c430
logging.level.org.springframework.security=WARN
