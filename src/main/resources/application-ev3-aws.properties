# Dedicated PostgreSQL after an explicitly approved H2 preservation/migration plan.
server.port=8080
spring.datasource.url=${CARRITO_DB_URL}
spring.datasource.username=${CARRITO_DB_USER}
spring.datasource.password=${CARRITO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
ev3.kafka.enabled=true
logging.level.org.springframework.security=WARN
